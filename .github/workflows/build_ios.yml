name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method'
        required: false
        default: 'debugging'
        type: choice
        options:
          - debugging
          - release-testing
          - app-store-connect
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build_ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup CMake policy wrapper
        shell: bash
        run: |
          REAL_CMAKE="$(which cmake)"
          echo "Original CMake found at: $REAL_CMAKE"
          mkdir -p "$HOME/cmake-bin"
          cat << EOF > "$HOME/cmake-bin/cmake"
#!/bin/bash
exec "$REAL_CMAKE" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "\$@"
EOF
          chmod +x "$HOME/cmake-bin/cmake"
          echo "$HOME/cmake-bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: Install Node dependencies
        run: npm ci

      - name: Initialize Tauri iOS project (if needed)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "Initializing Tauri iOS project..."
            npx tauri ios init
          else
            echo "Tauri iOS project already exists."
          fi

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri iOS App
        run: |
          EXPORT_OPT="${{ github.event.inputs.export_method || 'debugging' }}"
          npx tauri ios build --export-method "$EXPORT_OPT" --no-sign

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          echo "Listing generated Apple files:"
          find src-tauri/gen/apple -maxdepth 4 -ls || true

          # If build directory exists, package it
          if [ -d "src-tauri/gen/apple/build" ]; then
            cd src-tauri/gen/apple/build
            zip -r ../../../../artifacts/neno-ios-build.zip .
            cd ../../../..
          fi

          # Also package entire apple gen folder just in case user needs the Xcode project
          zip -r artifacts/neno-xcode-project.zip src-tauri/gen/apple -x "*/DerivedData/*" "*/.build/*"

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neno-iOS-Build
          path: artifacts/*.zip
          retention-days: 14
