name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method'
        required: false
        default: 'debugging'
        type: choice
        options:
          - debugging
          - release-testing
          - app-store-connect
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup CMake policy wrapper
        run: |
          mkdir -p "$HOME/cmake-bin"
          cp scripts/cmake-wrapper.sh "$HOME/cmake-bin/cmake"
          chmod +x "$HOME/cmake-bin/cmake"
          echo "$HOME/cmake-bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: Install Node dependencies
        run: npm ci

      - name: Initialize Tauri iOS project (if needed)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "Initializing Tauri iOS project..."
            npx tauri ios init
          else
            echo "Tauri iOS project already exists."
          fi

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri iOS App
        run: |
          npx tauri ios build --export-method debugging --no-sign

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          echo "Searching for compiled .ipa and .app files:"
          find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} artifacts/Neno-Music.ipa \; || true
          
          if [ ! -f "artifacts/Neno-Music.ipa" ]; then
            echo "Direct IPA not found in expected folder, searching everywhere in apple gen:"
            find src-tauri/gen/apple -name "*.ipa" -exec cp {} artifacts/Neno-Music.ipa \; || true
          fi

          zip -r artifacts/neno-xcode-project.zip src-tauri/gen/apple -x "*/DerivedData/*"

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neno-iOS-Build
          path: |
            artifacts/Neno-Music.ipa
            artifacts/*.zip
          retention-days: 14
